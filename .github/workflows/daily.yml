name: Daily GTA clips

on:
  schedule:
    - cron: "17 12 * * *"   # 17:47 IST every day
  workflow_dispatch: {}      # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  clip-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt
      - name: YouTube cookies (optional, helps against bot checks)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > cookies.txt; fi
      - name: Find moments, edit, post
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENABLE_YOUTUBE: ${{ vars.ENABLE_YOUTUBE || 'true' }}
          ENABLE_INSTAGRAM: ${{ vars.ENABLE_INSTAGRAM || 'true' }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY || '2' }}
          CLIP_LEN: ${{ vars.CLIP_LEN || '40' }}
          WHISPER_MODEL: base
          QUEUE_DIR: queue
          POSTED_DIR: posted
        run: python cloud_run.py
      - name: Save progress
        if: always()
        run: |
          git config user.name "clips-bot"
          git config user.email "clips-bot@users.noreply.github.com"
          for f in processed_streams.json posted_log.csv; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Daily run $(date -u +%F)" || echo "nothing to commit"
          git push
      - name: Keep clips for 7 days (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: |
            queue/
            posted/
            autopost.log
          retention-days: 7
